<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>404 – Page Not Found</title>

    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.0.0-beta1/css/bootstrap.min.css}"/>

    <style>
        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            background: url('/assets/img/porscheview3.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
        }

        /* ===== NAVBAR ===== */
        .theme-nav {
            background: rgba(10, 12, 14, 0.55);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .theme-nav .navbar-brand {
            font-weight: 700;
            letter-spacing: .4px;
            color: rgba(255,255,255,.95);
        }

        /* ===== OVERLAY ===== */
        .page-overlay {
            min-height: calc(100vh - 64px);
            background: linear-gradient(
                    90deg,
                    rgba(0,0,0,0.75) 0%,
                    rgba(0,0,0,0.45) 45%,
                    rgba(0,0,0,0.18) 100%
            );
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        /* ===== GLASS CARD ===== */
        .glass-card {
            max-width: 720px;
            width: 100%;
            border-radius: 20px;
            background: rgba(0,0,0,0.40);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 20px 60px rgba(0,0,0,0.55);
            padding: 48px;
            text-align: center;
        }

        .error-code {
            font-size: 140px;
            font-weight: 800;
            line-height: 1;
            color: rgba(255,255,255,0.20);
        }

        .muted {
            color: rgba(255,255,255,0.75);
        }

        .btn-ghost {
            border: 1px solid rgba(255,255,255,0.35);
            background: transparent;
            color: #fff;
        }

        .btn-ghost:hover {
            background: rgba(255,255,255,0.12);
            color: #fff;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark static-top theme-nav">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
            <img th:src="@{/assets/img/aando8.png}" alt="Logo" style="height:26px; margin-right:10px;">
            Alpha&Omega Motors
        </a>

        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive">
            <span class="navbar-toggler-icon"></span>
        </button>
    </div>
</nav>


<!-- CONTENT -->
<div class="page-overlay">
    <div class="glass-card">

        <!-- ERROR CODE -->
        <div class="error-code">404</div>

        <!-- TITLE -->
        <h1 class="mb-3">Page Not Found</h1>

        <!-- DESCRIPTION -->
        <p class="muted mb-4">
            Oops! The page you’re looking for doesn’t exist or has been moved.
        </p>

        <!-- OPTIONAL URL -->
        <p class="muted mb-4" th:if="${path}">
            Requested URL: <code th:text="${path}"></code>
        </p>

        <!-- ACTIONS -->
        <div class="d-flex justify-content-center gap-2 flex-wrap">
            <a th:href="@{/index}" class="btn btn-primary">
                Go Home
            </a>
            <a th:href="@{/main}" class="btn btn-success">
                Dashboard
            </a>
            <a href="javascript:history.back()" class="btn btn-ghost">
                Go Back
            </a>
        </div>

    </div>
</div>

<script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
</body>
</html>
