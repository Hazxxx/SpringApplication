<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.0.0-beta1/css/bootstrap.min.css}"/>
    <style>
        .error-container {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-code {
            font-size: 120px;
            font-weight: bold;
            color: #6c757d;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">BDBT Spring Boot Project</a>
    </div>
</nav>

<div class="container error-container">
    <div class="text-center">
        <!-- Duży kod błędu -->
        <div class="error-code">404</div>

        <!-- Tytuł błędu -->
        <h1 class="display-4 mb-4">Page Not Found</h1>

        <!-- Opis -->
        <p class="lead text-muted mb-4">
             Oops! The page you're looking for doesn't exist.
        </p>

        <div class="alert alert-secondary d-inline-block" role="alert">
            <strong>What happened?</strong><br/>
            The page you requested could not be found on this server.
            It might have been moved, deleted, or the URL might be incorrect.
        </div>

        <!-- Opcjonalnie: wyświetl URL który spowodował błąd -->
        <p class="text-muted mt-3" th:if="${errorUrl}">
            Requested URL: <code th:text="${errorUrl}"></code>
        </p>

        <!-- Przyciski nawigacji -->
        <div class="mt-4">
            <a th:href="@{/index}" class="btn btn-primary btn-lg mr-2">
                 Go Home
            </a>
            <a th:href="@{/main}" class="btn btn-success btn-lg mr-2">
                 Dashboard
            </a>
            <a href="javascript:history.back()" class="btn btn-secondary btn-lg">
                 Go Back
            </a>
        </div>
    </div>
</div>

<script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>

</body>
</html>
