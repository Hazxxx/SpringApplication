<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>User Dashboard</title>

    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.0.0-beta1/css/bootstrap.min.css}"/>

    <style>
        html, body { height: 100%; }

        body {
            margin: 0;
            background: url('/assets/img/porscheview3.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
        }

        /* ===== NAVBAR (SAME THEME) ===== */
        .theme-nav {
            background: rgba(10, 12, 14, 0.55) !important;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.10);
            padding: 10px 0;
        }

        .theme-nav .navbar-brand {
            font-weight: 700;
            letter-spacing: .4px;
            color: rgba(255,255,255,.92) !important;
        }

        .theme-nav .navbar-brand img {
            filter: drop-shadow(0 6px 16px rgba(0,0,0,.45));
        }

        .theme-nav .nav-link {
            color: rgba(255,255,255,.78) !important;
            padding: .45rem .75rem;
            border-radius: 10px;
            transition: background .2s ease, color .2s ease, transform .2s ease;
        }

        .theme-nav .nav-link:hover {
            color: rgba(255,255,255,.95) !important;
            background: rgba(255,255,255,.10);
            transform: translateY(-1px);
        }

        .theme-nav .nav-item.active .nav-link {
            color: rgba(255,255,255,.95) !important;
            background: rgba(255,255,255,.14);
            border: 1px solid rgba(255,255,255,.12);
        }

        /* ===== PAGE OVERLAY ===== */
        .page-overlay {
            min-height: calc(100vh - 64px);
            background: linear-gradient(
                    90deg,
                    rgba(0,0,0,0.75) 0%,
                    rgba(0,0,0,0.45) 45%,
                    rgba(0,0,0,0.18) 100%
            );
            padding: 44px 0;
        }

        /* ===== GLASS CARDS ===== */
        .glass-card {
            border-radius: 18px;
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 20px 60px rgba(0,0,0,0.45);
        }

        .muted { color: rgba(255,255,255,0.80); }

        .pill {
            display: inline-block;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(255,255,255,0.10);
            border: 1px solid rgba(255,255,255,0.14);
            margin: 6px 8px 0 0;
        }

        .btn-ghost {
            border: 1px solid rgba(255,255,255,0.35);
            background: transparent;
            color: #fff;
        }

        .btn-ghost:hover {
            background: rgba(255,255,255,0.12);
            color: #fff;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark static-top theme-nav">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
            <img th:src="@{/assets/img/aando8.png}" alt="Logo" style="height:26px; margin-right:10px;">
            Alpha&Omega Motors
        </a>

        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarResponsive">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/main}">Main</a>
                </li>

                <li class="nav-item active">
                    <a class="nav-link" href="#">Dashboard</a>
                </li>

                <li class="nav-item d-flex align-items-center">
    <span class="nav-link" style="color: rgba(255,255,255,.85);">
        Logged as:
        <b style="text-transform:capitalize" sec:authentication="name">Guest</b>
    </span>
                </li>

                <li class="nav-item">
                    <form method="post" th:action="@{/logout}" class="d-inline">
                        <button class="nav-link btn btn-link"
                                style="
                    color:rgba(255,255,255,.85);
                    padding:.45rem .75rem;
                    border-radius:10px;
                ">
                            Logout
                        </button>
                    </form>
                </li>

            </ul>
        </div>
    </div>
</nav>

<!-- CONTENT -->
<div class="page-overlay">
    <div class="container">

        <!-- HEADER -->
        <div class="glass-card p-4 mb-4">
            <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
                <div>
                    <h2 class="mb-1">👤 User Dashboard</h2>
                    <div class="muted">
                        Welcome <b style="text-transform:capitalize" sec:authentication="name">Guest</b>, here's your access overview.
                    </div>
                </div>
            </div>
        </div>

        <!-- ROLES -->
        <!-- <div class="glass-card p-4 mb-4">
            <h5 class="mb-2">🔐 Your Roles</h5>
            <div class="muted mb-2">Roles assigned to your account:</div>-->

            <!-- Using Spring Security Thymeleaf extras -->
        <!--<span class="pill" sec:authorize="hasRole('USER')">ROLE_USER</span>
        <span class="pill" sec:authorize="hasRole('ADMIN')">ROLE_ADMIN</span> -->

        <!-- Fallback if no roles -->
        <!--<span class="pill" sec:authorize="!hasAnyRole('USER', 'ADMIN')">
            (no roles assigned)
        </span>
    </div> -->

    <!-- QUICK ACTIONS -->
        <div class="glass-card p-4">
            <h5 class="mb-3">⚡ Quick Actions</h5>
            <div class="d-flex flex-wrap gap-2">
                <a class="btn btn-ghost" th:href="@{/user/profile}">My Profile</a>
                <!-- <a class="btn btn-info" href="#">My Documents</a> -->
                <!-- <a class="btn btn-success" href="#">Messages</a> -->
                <a class="btn btn-ghost" href="#">Settings</a>
                <a class="btn btn-ghost" th:href="@{/main}">Back to Main</a>
            </div>
        </div>

    </div>
</div>

<script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
</body>
</html>
