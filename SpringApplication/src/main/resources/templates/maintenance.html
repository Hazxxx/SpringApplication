<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Maintenance - Alpha&Omega Motors</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background: url('/assets/img/porscheview3.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .maintenance-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                    135deg,
                    rgba(0,0,0,0.85) 0%,
                    rgba(139, 0, 0, 0.45) 50%,
                    rgba(0,0,0,0.85) 100%
            );
        }

        .maintenance-content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 40px;
            max-width: 600px;
        }

        .glass-container {
            background: rgba(0,0,0,0.50);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 60px 40px;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 20px 80px rgba(0,0,0,0.7);
        }

        .logo {
            margin-bottom: 30px;
        }

        .logo img {
            height: 50px;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
        }

        h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .icon {
            font-size: 72px;
            margin-bottom: 24px;
            display: block;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            color: rgba(255,255,255,0.85);
            margin-bottom: 16px;
        }

        .status-badge {
            display: inline-block;
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid rgba(220, 53, 69, 0.5);
            color: #dc3545;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .back-soon {
            margin-top: 30px;
            font-size: 16px;
            color: rgba(255,255,255,0.6);
            font-style: italic;
        }

        .admin-login-box {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .admin-login-btn {
            display: inline-block;
            background: linear-gradient(135deg, #8B0000 0%, #DC143C 100%);
            color: #fff;
            padding: 12px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 4px 15px rgba(139, 0, 0, 0.4);
        }

        .admin-login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 0, 0, 0.6);
            background: linear-gradient(135deg, #A00000 0%, #FF1744 100%);
        }

        .admin-hint {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 16px;
        }
    </style>
</head>

<body>
<div class="maintenance-overlay"></div>

<div class="maintenance-content">
    <div class="glass-container">
        <div class="logo">
            <img src="/assets/img/aando8.png" alt="Alpha&Omega Motors">
        </div>

        <span class="icon">🛠️</span>

        <h1>Maintenance Mode</h1>

        <p>Our system is currently undergoing scheduled maintenance to improve your experience.</p>

        <p>We appreciate your patience and understanding.</p>

        <div class="status-badge">
            System Temporarily Unavailable
        </div>

        <p class="back-soon">We'll be back online shortly.</p>

        <!-- Admin Login Section -->
        <div class="admin-login-box">
            <p class="admin-hint">🔐 System Administrator?</p>
            <a href="/login" class="admin-login-btn">
                Admin Login
            </a>
        </div>
    </div>
</div>
</body>
</html>
