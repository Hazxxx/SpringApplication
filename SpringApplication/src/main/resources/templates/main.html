<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title>Main Page</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.0.0-beta1/css/bootstrap.min.css}"/>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark static-top">
    <div class="container">
        <a class="navbar-brand" href="/">BDBT Spring Boot Project - Part II</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarResponsive">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/index}">Home</a>
                </li>
                <li class="nav-item active">
                    <a class="nav-link" href="#">Main</a>
                </li>
                <li class="nav-item">
                    <span class="nav-link" style="color:lightskyblue;">
                        You are logged in as
                        <b style="text-transform:capitalize"
                           th:text="${#authentication.name}">Guest</b>
                    </span>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row">
        <div class="col-md-10 mt-5">

            <h3>Welcome
                <b style="color:lightskyblue; text-transform:capitalize"
                   th:text="${#authentication.name}">Guest</b>!
            </h3>

            <p class="mt-3">Choose your dashboard:</p>

            <!-- Panel użytkownika - dostępny dla USER i ADMIN -->
            <div class="card mb-3" sec:authorize="hasRole('USER')">
                <div class="card-body">
                    <h5 class="card-title">👤 User Dashboard</h5>
                    <p class="card-text">Access your personal user panel.</p>
                    <a th:href="@{/user/dashboard}" class="btn btn-primary">Go to User Dashboard</a>
                </div>
            </div>

            <!-- Panel admina - tylko dla ADMIN -->
            <div class="card mb-3 border-danger" sec:authorize="hasRole('ADMIN')">
                <div class="card-body">
                    <h5 class="card-title text-danger">⚙️ Admin Dashboard</h5>
                    <p class="card-text">Access administrative panel with full permissions.</p>
                    <a th:href="@{/admin/dashboard}" class="btn btn-danger">Go to Admin Dashboard</a>
                </div>
            </div>

            <form th:action="@{/logout}" method="post" class="mt-4">
                <button class="btn btn-secondary" type="submit">Logout</button>
            </form>

        </div>
    </div>
</div>

<script th:src="@{/webjars/jquery/jquery.min.js}"></script>
<script th:src="@{/webjars/popper.js/umd/popper.min.js}"></script>
<script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>

</body>
</html>
