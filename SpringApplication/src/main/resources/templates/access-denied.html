<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Access Denied</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.0.0-beta1/css/bootstrap.min.css}"/>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark static-top">
  <div class="container">
    <a class="navbar-brand" href="/">BDBT Spring Boot Project</a>
  </div>
</nav>

<div class="container">
  <div class="row">
    <div class="col-md-10 mt-5">
      <div class="alert alert-danger" role="alert">
        <h4 class="alert-heading">Access Denied!</h4>
        <p>Sorry, you don't have permission to access this resource.</p>
        <hr>
        <p class="mb-0">Please contact your administrator if you believe this is an error.</p>
      </div>

      <div class="mt-4">
        <a th:href="@{/main}" class="btn btn-primary">Go to Main Page</a>
        <a th:href="@{/index}" class="btn btn-secondary">Go to Home</a>
      </div>
    </div>
  </div>
</div>

<script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>

</body>
</html>
