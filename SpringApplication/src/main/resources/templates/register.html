<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Register</title>

    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.0.0-beta1/css/bootstrap.min.css}"/>

    <style>
        html, body { height: 100%; }
        body {
            margin: 0;
            background: url('/assets/img/porscheview4.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
        }
        .theme-nav {
            background: rgba(10, 12, 14, 0.55) !important;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.10);
            padding: 10px 0;
        }
        .theme-nav .nav-link { color: rgba(255,255,255,.78) !important; border-radius: 10px; }
        .theme-nav .nav-link:hover { background: rgba(255,255,255,.10); color: rgba(255,255,255,.95) !important; }
        .page-overlay {
            min-height: calc(100vh - 64px);
            background: linear-gradient(90deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.45) 45%, rgba(0,0,0,0.18) 100%);
            display: flex;
            align-items: center;
            padding: 44px 0;
        }
        .glass-card {
            max-width: 720px;
            border-radius: 18px;
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 20px 60px rgba(0,0,0,0.45);
            padding: 28px;
        }
        .form-control {
            background: rgba(255,255,255,0.10);
            border: 1px solid rgba(255,255,255,0.18);
            color: #fff;
            border-radius: 12px;
            padding: 12px 12px;
        }
        .form-control:focus {
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.35);
            box-shadow: 0 0 0 .2rem rgba(255,255,255,0.12);
            color: #fff;
        }
        .btn-ghost { border: 1px solid rgba(255,255,255,0.35); background: transparent; color: #fff; }
        .btn-ghost:hover { background: rgba(255,255,255,0.12); color: #fff; }
        .msg {
            padding: 12px 14px;
            border-radius: 12px;
            background: rgba(25,135,84,0.20);
            border: 1px solid rgba(25,135,84,0.35);
        }
        .err {
            padding: 12px 14px;
            border-radius: 12px;
            background: rgba(220,53,69,0.20);
            border: 1px solid rgba(220,53,69,0.35);
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark static-top theme-nav">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
            <img th:src="@{/assets/img/aando8.png}" alt="Logo" style="height:26px; margin-right:10px;">
            Alpha&Omega Motors
        </a>

        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/login}">Login</a></li>
                <li class="nav-item"><a class="nav-link active" href="#">Register</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="page-overlay">
    <div class="container">
        <div class="glass-card mx-auto">

            <h2 class="mb-2">Create account</h2>
            <div class="text-white-50 mb-3">Register as a client.</div>

            <!-- SUCCESS -->
            <div th:if="${param.success}" class="msg mb-3">
                ✅ Registration successful! You can now sign in.
                <div class="mt-2">
                    <a class="btn btn-primary" th:href="@{/login}">Go to Login</a>
                </div>
            </div>

            <!-- ERROR -->
            <div th:if="${error}" class="err mb-3" th:text="${error}">
                error
            </div>

            <form method="post" th:action="@{/register}" th:object="${form}" th:if="${param.success == null}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">First name</label>
                        <input class="form-control" type="text" th:field="*{firstName}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Last name</label>
                        <input class="form-control" type="text" th:field="*{lastName}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input class="form-control"
                               type="email"
                               th:field="*{email}"
                               maxlength="100"
                               required>

                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Phone</label>
                        <input class="form-control"
                               type="tel"
                               th:field="*{phone}"
                               placeholder="+48123456789"
                               pattern="^\+[1-9]\d{7,14}$"
                               title="Phone must be in international format, e.g. +48123456789"
                               required>

                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Password</label>
                        <input class="form-control"
                               type="password"
                               th:field="*{password}"
                               minlength="8"
                               pattern="^(?=.*[A-Z])(?=.*[a-z])(?=.*\d).{8,}$"
                               title="Min 8 chars, 1 uppercase, 1 lowercase, 1 digit"
                               required>

                    </div>

                    <div class="col-12"><hr class="border-light opacity-25"></div>

                    <div class="col-md-6">
                        <label class="form-label">Street</label>
                        <input class="form-control" type="text" th:field="*{street}" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">House no.</label>
                        <input class="form-control" type="text" th:field="*{houseNumber}" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Apartment no.</label>
                        <input class="form-control" type="text" th:field="*{apartmentNumber}">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Postal code</label>
                        <input class="form-control"
                               type="text"
                               th:field="*{postalCode}"
                               pattern="^\d{2}-\d{3}$"
                               placeholder="00-000"
                               required>

                    </div>
                    <div class="col-md-8">
                        <label class="form-label">City</label>
                        <input class="form-control" type="text" th:field="*{city}" required>
                    </div>
                </div>

                <div class="d-flex gap-2 flex-wrap mt-4">
                    <button class="btn btn-primary btn-lg" type="submit">Register</button>
                    <a class="btn btn-ghost btn-lg" th:href="@{/}">Back</a>
                </div>
            </form>

        </div>
    </div>
</div>

<script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
</body>
</html>
