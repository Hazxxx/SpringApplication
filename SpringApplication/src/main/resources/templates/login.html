<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Login</title>

    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.0.0-beta1/css/bootstrap.min.css}"/>

    <style>
        /* ===== GLOBAL ===== */
        html, body { height: 100%; }

        body {
            margin: 0;
            background: url('/assets/img/porscheview4.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
        }

        /* ===== NAVBAR (SAME AS INDEX) ===== */
        .theme-nav {
            background: rgba(10, 12, 14, 0.55) !important;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.10);
            padding: 10px 0;
        }

        .theme-nav .navbar-brand {
            font-weight: 700;
            letter-spacing: .4px;
            color: rgba(255,255,255,.92) !important;
        }

        .theme-nav .navbar-brand img {
            filter: drop-shadow(0 6px 16px rgba(0,0,0,.45));
        }

        .theme-nav .nav-link {
            color: rgba(255,255,255,.78) !important;
            padding: .45rem .75rem;
            border-radius: 10px;
            transition: background .2s ease, color .2s ease, transform .2s ease;
        }

        .theme-nav .nav-link:hover {
            color: rgba(255,255,255,.95) !important;
            background: rgba(255,255,255,.10);
            transform: translateY(-1px);
        }

        .theme-nav .nav-item.active .nav-link {
            color: rgba(255,255,255,.95) !important;
            background: rgba(255,255,255,.14);
            border: 1px solid rgba(255,255,255,.12);
        }

        /* ===== LAYOUT ===== */
        .page-overlay {
            min-height: calc(100vh - 64px);
            background: linear-gradient(
                    90deg,
                    rgba(0,0,0,0.75) 0%,
                    rgba(0,0,0,0.45) 45%,
                    rgba(0,0,0,0.18) 100%
            );
            display: flex;
            align-items: center;
        }

        .login-card {
            max-width: 520px;
            border-radius: 18px;
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 20px 60px rgba(0,0,0,0.45);
            padding: 28px;
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .brand-row img {
            height: 40px;
            width: auto;
            filter: drop-shadow(0 6px 18px rgba(0,0,0,0.45));
        }

        .brand-title {
            font-size: 16px;
            letter-spacing: 0.6px;
            opacity: 0.95;
        }

        .login-title {
            font-size: 34px;
            font-weight: 800;
            margin: 0 0 6px 0;
        }

        .login-subtitle {
            opacity: 0.88;
            margin-bottom: 18px;
        }

        /* ===== FORM ===== */
        .form-label {
            color: rgba(255,255,255,.9);
            margin-bottom: 6px;
        }

        .form-control {
            background: rgba(255,255,255,0.10);
            border: 1px solid rgba(255,255,255,0.18);
            color: #fff;
            border-radius: 12px;
            padding: 12px 12px;
        }

        .form-control::placeholder {
            color: rgba(255,255,255,0.55);
        }

        .form-control:focus {
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.35);
            box-shadow: 0 0 0 .2rem rgba(255,255,255,0.12);
            color: #fff;
        }

        .error-box {
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 12px;
            background: rgba(220,53,69,0.18);
            border: 1px solid rgba(220,53,69,0.35);
            color: rgba(255,255,255,0.92);
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        .btn-ghost {
            border: 1px solid rgba(255,255,255,0.35);
            background: transparent;
            color: #fff;
        }

        .btn-ghost:hover {
            background: rgba(255,255,255,0.12);
            color: #fff;
        }

        @media (max-width: 768px) {
            .login-card { margin: 0 14px; padding: 22px; }
            .login-title { font-size: 28px; }
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark static-top theme-nav">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
            <img th:src="@{/assets/img/aando8.png}" alt="Logo" style="height:26px; margin-right:10px;">
            Alpha&Omega Motors
        </a>

        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarResponsive">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Home</a>
                </li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/register}">Register</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- LOGIN -->
<div class="page-overlay">
    <div class="container">
        <div class="login-card">

            <div class="brand-row">
                <img th:src="@{/assets/img/aando8.png}" alt="Logo">
                <div class="brand-title">Alpha&Omega Motors</div>
            </div>

            <h1 class="login-title">Sign in</h1>
            <div class="login-subtitle">Secure access to your showroom dashboard.</div>

            <form method="post" th:action="@{/login}">
                <div class="mb-3">
                    <label for="login" class="form-label">Login</label>
                    <input id="login" type="text" class="form-control"
                           placeholder="Enter login"
                           autocomplete="off"
                           name="username"
                           pattern="^[a-zA-Z0-9._-]{3,40}$"
                           title="3–40 chars, letters, numbers, . _ - only"
                           required/>
                </div>

                <div class="mb-2">
                    <label for="password" class="form-label">Password</label>
                    <input id="password" type="password" class="form-control"
                           placeholder="Enter your password"
                           name="password"
                           minlength="8"
                           required/>
                </div>

                <div th:if="${param.error}" class="error-box">
                    ERROR: Invalid username or password!
                </div>

                <div class="actions">
                    <button class="btn btn-primary btn-lg" type="submit">Login</button>
                    <a class="btn btn-ghost btn-lg" th:href="@{/}">Back</a>
                </div>
            </form>

        </div>
    </div>
</div>

<script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
</body>
</html>
