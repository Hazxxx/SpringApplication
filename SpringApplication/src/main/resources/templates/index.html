<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Welcome Page</title>

    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.0.0-beta1/css/bootstrap.min.css}"/>

    <style>
        /* ===== GLOBAL ===== */
        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            background: url('/assets/img/porscheview3.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
        }

        /* ===== NAVBAR (GLASS / THEME) ===== */
        .theme-nav {
            background: rgba(10, 12, 14, 0.55) !important;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.10);
            padding: 10px 0;
        }

        .theme-nav .navbar-brand {
            font-weight: 700;
            letter-spacing: .4px;
            color: rgba(255,255,255,.92) !important;
        }

        .theme-nav .navbar-brand img {
            filter: drop-shadow(0 6px 16px rgba(0,0,0,.45));
        }

        .theme-nav .nav-link {
            color: rgba(255,255,255,.78) !important;
            padding: .45rem .75rem;
            border-radius: 10px;
            transition: background .2s ease, color .2s ease, transform .2s ease;
        }

        .theme-nav .nav-link:hover {
            color: rgba(255,255,255,.95) !important;
            background: rgba(255,255,255,.10);
            transform: translateY(-1px);
        }

        .theme-nav .nav-item.active .nav-link {
            color: rgba(255,255,255,.95) !important;
            background: rgba(255,255,255,.14);
            border: 1px solid rgba(255,255,255,.12);
        }

        .theme-nav .nav-link.accent {
            border: 1px solid rgba(255, 200, 90, .35);
        }

        /* ===== HERO ===== */
        .hero-overlay {
            min-height: calc(100vh - 64px);
            background: linear-gradient(
                    90deg,
                    rgba(0,0,0,0.75) 0%,
                    rgba(0,0,0,0.40) 45%,
                    rgba(0,0,0,0.10) 100%
            );
            display: flex;
            align-items: center;
        }

        .hero-card {
            max-width: 720px;
            padding: 32px;
            border-radius: 18px;
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 20px 60px rgba(0,0,0,0.45);
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }

        .brand-logo {
            height: 56px;
            filter: drop-shadow(0 6px 18px rgba(0,0,0,0.45));
        }

        .brand-name {
            font-size: 18px;
            letter-spacing: 0.6px;
            opacity: 0.95;
        }

        .hero-title {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .hero-subtitle {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 22px;
        }

        .hero-actions {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .btn-ghost {
            border: 1px solid rgba(255,255,255,0.35);
            background: transparent;
            color: #fff;
        }

        .btn-ghost:hover {
            background: rgba(255,255,255,0.12);
            color: #fff;
        }

        @media (max-width: 768px) {
            .hero-title { font-size: 32px; }
            .hero-card { margin: 0 14px; }
            .brand-logo { height: 46px; }
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark static-top theme-nav">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
            <img th:src="@{/assets/img/aando8.png}" alt="Logo" style="height:26px; margin-right:10px;">
            Alpha&Omega Motors
        </a>

        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarResponsive">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/main}">Main</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/login}">Login</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- HERO -->
<div class="hero-overlay">
    <div class="container">
        <div class="hero-card">

            <div class="brand-row">
                <img class="brand-logo" th:src="@{/assets/img/aando8.png}" alt="Logo">
                <div class="brand-name">Alpha&Omega Motors</div>
            </div>

            <h1 class="hero-title">Welcome</h1>

            <p class="hero-subtitle">
                Modern access to your showroom dashboard.<br>
                Secure login and clean navigation.
            </p>

            <div class="hero-actions">
                <a class="btn btn-ghost btn-lg" th:href="@{/register}">
                    Register
                </a>
                <a class="btn btn-ghost btn-lg" th:href="@{/login}">Login</a>
                <a class="btn btn-ghost btn-lg" th:href="@{/main}">Go to Main</a>
            </div>

        </div>
    </div>
</div>

<script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
</body>
</html>
