<!DOCTYPE HTML>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${isEdit ? 'Edit Model' : 'Add New Model'}">Add Model</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.0.0-beta1/css/bootstrap.min.css}"/>
    <style>
        html, body { height: 100%; }
        body {
            margin: 0;
            background: url('/assets/img/porscheview3.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
        }
        .theme-nav {
            background: rgba(139, 0, 0, 0.65);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .page-overlay {
            min-height: calc(100vh - 64px);
            background: linear-gradient(90deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.45) 45%, rgba(0,0,0,0.18) 100%);
            padding: 40px 0;
        }
        .glass-card {
            border-radius: 20px;
            background: rgba(0,0,0,0.40);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 20px 60px rgba(0,0,0,0.55);
        }
        .admin-badge {
            background: #dc3545;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            margin-left: 8px;
        }
        .form-control, .form-select {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
        }
        .form-control:focus, .form-select:focus {
            background: rgba(255,255,255,0.15);
            border-color: #dc3545;
            color: #fff;
        }
        .form-control::placeholder {
            color: rgba(255,255,255,0.5);
        }
        .form-label {
            color: #fff;
            font-weight: 500;
        }
        .form-select option {
            background: #333;
            color: #fff;
        }
        .breadcrumb {
            background: transparent;
            margin-bottom: 0;
        }
        .breadcrumb-item a {
            text-decoration: none;
        }
        /* === LOGOUT FIX === */
        .logout-form {
            margin: 0;
        }

        .logout-link {
            background: transparent;
            border: none;
            padding: .45rem .75rem;
            color: rgba(255,255,255,.78);
            border-radius: 10px;
            transition: background .2s ease, color .2s ease;
        }

        .logout-link:hover {
            background: rgba(255,255,255,.10);
            color: rgba(255,255,255,.95);
        }

        .logout-link:focus,
        .logout-link:active {
            outline: none;
            box-shadow: none;
        }

    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark theme-nav">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
            <img th:src="@{/assets/img/aando8.png}" style="height:26px;margin-right:10px;">
            Alpha&Omega Motors
            <span class="admin-badge">ADMIN</span>
        </a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/dashboard}">Dashboard</a></li>
                <li class="nav-item">
                    <span class="nav-link">Logged as <b sec:authentication="name"></b></span>
                </li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="logout-form">
                        <button type="submit" class="nav-link logout-link">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="page-overlay">
    <div class="container">

        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}" class="text-white">Admin</a></li>
                <li class="breadcrumb-item"><a th:href="@{/admin/database}" class="text-white">Database</a></li>
                <li class="breadcrumb-item"><a th:href="@{/admin/database/modele}" class="text-white">Modele</a></li>
                <li class="breadcrumb-item active text-light" th:text="${isEdit ? 'Edit' : 'New'}">New</li>
            </ol>
        </nav>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="glass-card p-4">
            <h2 class="mb-4" th:text="${isEdit ? 'Edit Model' : 'Add New Model'}">Add Model</h2>

            <form th:action="${isEdit ? '/admin/database/modele/' + model.idModelu : '/admin/database/modele'}"
                  method="post"
                  th:object="${model}">

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="idMarki" class="form-label">Brand <span class="text-danger">*</span></label>
                        <select class="form-select" id="idMarki" th:field="*{idMarki}" required>
                            <option value="">Select Brand...</option>
                            <option th:each="marka : ${marki}"
                                    th:value="${marka.idMarki}"
                                    th:text="${marka.nazwa}">Porsche</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="rocznikModelowy" class="form-label">Model Year <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" id="rocznikModelowy"
                               th:field="*{rocznikModelowy}"
                               placeholder="e.g., 2024"
                               min="1900" max="2100" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="typNadwozia" class="form-label">Body Type <span class="text-danger">*</span></label>
                        <select class="form-select" id="typNadwozia" th:field="*{typNadwozia}" required>
                            <option value="">Select Body Type...</option>
                            <option value="Sedan">Sedan</option>
                            <option value="Coupe">Coupe</option>
                            <option value="Hatchback">Hatchback</option>
                            <option value="SUV">SUV</option>
                            <option value="Kombi">Kombi (Station Wagon)</option>
                            <option value="Kabriolet">Kabriolet (Convertible)</option>
                            <option value="Van">Van</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="typPaliwa" class="form-label">Fuel Type <span class="text-danger">*</span></label>
                        <select class="form-select" id="typPaliwa" th:field="*{typPaliwa}" required>
                            <option value="">Select Fuel Type...</option>
                            <option value="Benzyna">Benzyna (Gasoline)</option>
                            <option value="Diesel">Diesel</option>
                            <option value="Hybryda">Hybryda (Hybrid)</option>
                            <option value="Elektryczny">Elektryczny (Electric)</option>
                            <option value="LPG">LPG</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="pojemnoscSilnika" class="form-label">Engine Capacity (cc) <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" id="pojemnoscSilnika"
                               th:field="*{pojemnoscSilnika}"
                               placeholder="e.g., 3000"
                               min="0" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label for="mocSilnika" class="form-label">Engine Power (HP) <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" id="mocSilnika"
                               th:field="*{mocSilnika}"
                               placeholder="e.g., 450"
                               min="0" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label for="masaWlasna" class="form-label">Curb Weight (kg) <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" id="masaWlasna"
                               th:field="*{masaWlasna}"
                               placeholder="e.g., 1500"
                               min="0" required>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-3">
                    <button type="submit" class="btn btn-success">
                        <span th:text="${isEdit ? 'Update' : 'Save'}">Save</span>
                    </button>
                    <a th:href="@{/admin/database/modele}" class="btn btn-secondary">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
</body>
</html>
