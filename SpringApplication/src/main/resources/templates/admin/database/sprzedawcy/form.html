<!DOCTYPE HTML>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${isEdit ? 'Edit Employee' : 'Add New Employee'}">Add Employee</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.0.0-beta1/css/bootstrap.min.css}"/>
    <style>
        html, body { height: 100%; }
        body {
            margin: 0;
            background: url('/assets/img/porscheview3.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
        }
        .theme-nav {
            background: rgba(139, 0, 0, 0.65);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .page-overlay {
            min-height: calc(100vh - 64px);
            background: linear-gradient(90deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.45) 45%, rgba(0,0,0,0.18) 100%);
            padding: 40px 0;
        }
        .glass-card {
            border-radius: 20px;
            background: rgba(0,0,0,0.40);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 20px 60px rgba(0,0,0,0.55);
        }
        .admin-badge {
            background: #dc3545;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            margin-left: 8px;
        }
        .form-control, .form-select {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
        }
        .form-control:focus, .form-select:focus {
            background: rgba(255,255,255,0.15);
            border-color: #dc3545;
            color: #fff;
        }
        .form-control::placeholder {
            color: rgba(255,255,255,0.5);
        }
        .form-select option {
            background: #1a1a1a;
            color: #fff;
        }
        .form-label {
            color: #fff;
            font-weight: 500;
        }
        .section-divider {
            border-top: 1px solid rgba(255,255,255,0.2);
            margin: 2rem 0 1.5rem;
            padding-top: 1rem;
        }
        .breadcrumb {
            background: transparent;
            margin-bottom: 0;
        }
        .breadcrumb-item a {
            text-decoration: none;
        }
        /* === LOGOUT FIX === */
        .logout-form {
            margin: 0;
        }

        .logout-link {
            background: transparent;
            border: none;
            padding: .45rem .75rem;
            color: rgba(255,255,255,.78);
            border-radius: 10px;
            transition: background .2s ease, color .2s ease;
        }

        .logout-link:hover {
            background: rgba(255,255,255,.10);
            color: rgba(255,255,255,.95);
        }

        .logout-link:focus,
        .logout-link:active {
            outline: none;
            box-shadow: none;
        }

    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark theme-nav">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
            <img th:src="@{/assets/img/aando8.png}" style="height:26px;margin-right:10px;">
            Alpha&Omega Motors
            <span class="admin-badge">ADMIN</span>
        </a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/dashboard}">Dashboard</a></li>
                <li class="nav-item">
                    <span class="nav-link">Logged as <b sec:authentication="name"></b></span>
                </li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="logout-form">
                        <button type="submit" class="nav-link logout-link">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="page-overlay">
    <div class="container">

        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}" class="text-white">Admin</a></li>
                <li class="breadcrumb-item"><a th:href="@{/admin/database}" class="text-white">Database</a></li>
                <li class="breadcrumb-item"><a th:href="@{/admin/database/sprzedawcy}" class="text-white">Employees</a></li>
                <li class="breadcrumb-item active text-light" th:text="${isEdit ? 'Edit' : 'New'}">New</li>
            </ol>
        </nav>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="glass-card p-4">
            <h2 class="mb-4" th:text="${isEdit ? 'Edit Employee' : 'Add New Employee'}">Add Employee</h2>

            <form th:action="${isEdit ? '/admin/database/sprzedawcy/' + sprzedawca.idPracownika : '/admin/database/sprzedawcy'}"
                  method="post"
                  th:object="${sprzedawca}">

                <!-- Personal Information -->
                <h5>Personal Information</h5>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="imie" class="form-label">First Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="imie"
                               th:field="*{imie}"
                               placeholder="e.g., Jan"
                               required maxlength="20">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="nazwisko" class="form-label">Last Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="nazwisko"
                               th:field="*{nazwisko}"
                               placeholder="e.g., Kowalski"
                               required maxlength="30">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="pesel" class="form-label">PESEL <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="pesel"
                               th:field="*{pesel}"
                               placeholder="12345678901"
                               required pattern="[0-9]{11}" maxlength="11">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label for="dataUrodzenia" class="form-label">Date of Birth <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" id="dataUrodzenia"
                               th:field="*{dataUrodzenia}"
                               required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label for="plec" class="form-label">Gender <span class="text-danger">*</span></label>
                        <select class="form-select" id="plec" th:field="*{plec}" required>
                            <option value="">Select...</option>
                            <option value="M">Male</option>
                            <option value="K">Female</option>
                        </select>
                    </div>
                </div>

                <!-- Contact Information -->
                <div class="section-divider">
                    <h5>Contact Information</h5>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" id="email"
                               th:field="*{email}"
                               placeholder="jan.kowalski@example.com"
                               required maxlength="40">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="telefon" class="form-label">Phone <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="telefon"
                               th:field="*{telefon}"
                               placeholder="+48 123 456 789"
                               required maxlength="12">
                    </div>
                </div>

                <!-- Address -->
                <div class="section-divider">
                    <h5>Address</h5>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="nowyMiasto" class="form-label">City <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="nowyMiasto"
                               th:field="*{nowyMiasto}"
                               placeholder="e.g., Warszawa"
                               required maxlength="30">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="nowaUlica" class="form-label">Street <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="nowaUlica"
                               th:field="*{nowaUlica}"
                               placeholder="e.g., Marszałkowska"
                               required maxlength="60">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-3 mb-3">
                        <label for="nowyNumerBudynku" class="form-label">Building No. <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" id="nowyNumerBudynku"
                               th:field="*{nowyNumerBudynku}"
                               placeholder="123"
                               required min="1">
                    </div>

                    <div class="col-md-3 mb-3">
                        <label for="nowyNumerLokalu" class="form-label">Apt/Unit No.</label>
                        <input type="number" class="form-control" id="nowyNumerLokalu"
                               th:field="*{nowyNumerLokalu}"
                               placeholder="Optional"
                               min="0">
                    </div>

                    <div class="col-md-3 mb-3">
                        <label for="nowyKodPocztowy" class="form-label">Postal Code <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="nowyKodPocztowy"
                               th:field="*{nowyKodPocztowy}"
                               placeholder="00-000"
                               required pattern="[0-9]{2}-[0-9]{3}" maxlength="6">
                    </div>

                    <div class="col-md-3 mb-3">
                        <label for="nowyKraj" class="form-label">Country <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="nowyKraj"
                               th:field="*{nowyKraj}"
                               placeholder="Polska"
                               required maxlength="30">
                    </div>
                </div>

                <!-- Employment Information -->
                <div class="section-divider">
                    <h5>Employment Information</h5>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="idSalonu" class="form-label">Salon <span class="text-danger">*</span></label>
                        <select class="form-select" id="idSalonu" th:field="*{idSalonu}" required>
                            <option value="">Select salon...</option>
                            <option th:each="salon : ${salony}"
                                    th:value="${salon.idSalonu}"
                                    th:text="${salon.nazwa}">Salon Name</option>
                        </select>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label for="idStanowiska" class="form-label">Position <span class="text-danger">*</span></label>
                        <select class="form-select" id="idStanowiska" th:field="*{idStanowiska}" required>
                            <option value="">Select position...</option>
                            <option th:each="stanowisko : ${stanowiska}"
                                    th:value="${stanowisko.idStanowiska}"
                                    th:text="${stanowisko.nazwa}">Position Name</option>
                        </select>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label for="idWynagrodzenia" class="form-label">Salary <span class="text-danger">*</span></label>
                        <select class="form-select" id="idWynagrodzenia" th:field="*{idWynagrodzenia}" required>
                            <option value="">Select salary...</option>
                            <option th:each="wynagrodzenie : ${wynagrodzenia}"
                                    th:value="${wynagrodzenie.idWynagrodzenia}"
                                    th:text="${wynagrodzenie.kwota + ' ' + wynagrodzenie.waluta}">Salary</option>
                        </select>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-success">
                        <span th:text="${isEdit ? 'Update' : 'Save'}">Save</span>
                    </button>
                    <a th:href="@{/admin/database/sprzedawcy}" class="btn btn-secondary">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
</body>
</html>
