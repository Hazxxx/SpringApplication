<!DOCTYPE HTML>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Admin Dashboard</title>

    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.0.0-beta1/css/bootstrap.min.css}"/>

    <style>
        html, body { height: 100%; }

        body {
            margin: 0;
            background: url('/assets/img/porscheview3.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
        }

        /* ===== NAVBAR ===== */
        .theme-nav {
            background: rgba(139, 0, 0, 0.65);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        /* ===== OVERLAY ===== */
        .page-overlay {
            min-height: calc(100vh - 64px);
            background: linear-gradient(
                    90deg,
                    rgba(0,0,0,0.75) 0%,
                    rgba(0,0,0,0.45) 45%,
                    rgba(0,0,0,0.18) 100%
            );
            padding: 40px 0;
        }

        /* ===== GLASS ===== */
        .glass-card {
            border-radius: 20px;
            background: rgba(0,0,0,0.40);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 20px 60px rgba(0,0,0,0.55);
        }

        .stat-card {
            padding: 24px;
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: 700;
        }

        .btn-ghost {
            border: 1px solid rgba(255,255,255,0.35);
            background: transparent;
            color: #fff;
        }

        .btn-ghost:hover {
            background: rgba(255,255,255,0.12);
        }

        .admin-badge {
            background: #dc3545;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            margin-left: 8px;
        }

        /* === LOGOUT FIX === */
        .logout-form {
            margin: 0;
        }

        .logout-link {
            background: transparent;
            border: none;
            padding: .45rem .75rem;
            color: rgba(255,255,255,.78);
            border-radius: 10px;
            transition: background .2s ease, color .2s ease;
        }

        .logout-link:hover {
            background: rgba(255,255,255,.10);
            color: rgba(255,255,255,.95);
        }

        .logout-link:focus,
        .logout-link:active {
            outline: none;
            box-shadow: none;
        }

    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark theme-nav">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
            <img th:src="@{/assets/img/aando8.png}" style="height:26px;margin-right:10px;">
            Alpha&Omega Motors
            <span class="admin-badge">ADMIN</span>
        </a>

        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
                <li class="nav-item active"><a class="nav-link" href="#">Admin Dashboard</a></li>
                <li class="nav-item">
                    <span class="nav-link">
                        Logged as <b sec:authentication="name"></b>
                    </span>
                </li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="logout-form">
                        <button type="submit" class="nav-link logout-link">Logout</button>
                    </form>
                </li>

            </ul>
        </div>
    </div>
</nav>

<div class="page-overlay">
    <div class="container">

        <!-- HEADER -->
        <div class="glass-card p-4 mb-4">
            <h2>Administrator Dashboard</h2>
            <p class="text-muted mb-0">
                Full administrative access to the system.
            </p>
        </div>

        <!-- STATS -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="glass-card stat-card">
                    <div class="stat-number" th:text="${clientsCount}">0</div>
                    Clients
                </div>
            </div>
            <div class="col-md-4">
                <div class="glass-card stat-card">
                    <div class="stat-number" th:text="${employeesCount}">0</div>
                    Employees
                </div>
            </div>
            <div class="col-md-4">
                <div class="glass-card stat-card">
                    <div class="stat-number" th:text="${adminsCount}">0</div>
                    Admins
                </div>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <div class="glass-card stat-card">
                    <div class="stat-number" th:text="${salonsCount}">0</div>
                    Salons
                </div>
            </div>
            <div class="col-md-6">
                <div class="glass-card stat-card">
                    <div class="stat-number" th:text="${companiesCount}">0</div>
                    Partner Companies
                </div>
            </div>
        </div>

        <!-- ADMIN ACTIONS (ZASTĘPUJE ADMIN MAIN) -->
        <div class="glass-card p-4">
            <h5 class="mb-3">Administration</h5>

            <div class="d-flex flex-wrap gap-2">
                <a class="btn btn-ghost" th:href="@{/admin/clients}">Manage Clients</a>
                <a class="btn btn-ghost" th:href="@{/admin/employees}">Manage Employees</a>
                <a class="btn btn-ghost" th:href="@{/admin/structure}">Database Management</a>
                <a class="btn btn-ghost" th:href="@{/admin/audit}">Audit Logs</a>
                <a class="btn btn-ghost" th:href="@{/admin/settings}">System Settings</a>
            </div>
        </div>

    </div>
</div>

<script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
</body>
</html>
